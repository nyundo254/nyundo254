<!DOCTYPE html>
<HTML>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device, intial-scale=1.0">
        <title>Document</title>  
        <style>
            .login{
                border: 3px solid yellow;
                max-width: max-content;
                padding: 20px 30px;
                margin: 10px auto;
            }
            input[type=button]{
                display: block;
                background-color: blanchedalmond;
                margin: 0 auto;
            }
        </style>
    </head>
    <body>
        <div class="login">
            <form>
                <label for="email"> Enter your email:</label>
                <input type="email" name="email" id="email"><br>
                <label for="password">Enter your password:</label>
                <input type="password" name="password" id="password"><br>
                <label for="title">Title:</label>
                <label for="Mr">Mr</label>
                <input type="radio" id="Mr" value="Mr" name="Mr">
                <label for="Phd">Phd</label>
                <input type="radio" id="Phd" value="Phd" name="Phd">
                <label for="Mrs">Mrs</label>
                <input type="radio" id="Mrs" value="Mrs" name="Mrs"><br>
                <label for="Gender">Gender:</label>
                <label for="Male">Male</label>
                <input type="checkbox" id="Male" value="Male" name="Male">
                <label for="Female">Female</label>
                <input type="checkbox" id="Female" value="Female" name="Female"><br>
                <label for="Country">Country:</label>
                <select id="country">
                    <option value="kenya">Kenya</option>
                    <option value="zambia">Zambia</option>
                    <option value="Tanzania">Tanzania</option>
                    <option value="Rwanda">Rwanda</option>
                    <option value="Burundi">Burundi</option>
                </select><br>
                <input type="reset"><br>
                <input type="submit"> <br>
                <label for="site-search">Search:</label>
                <input type="search" id="site-searh" name="search">
                <button>Search</button><br>
                <a href="www.youtube.com">YouTube</a><br>
                <input type="button" value="login">
                

            </form>
        </div>
    </body>
</HTML>
